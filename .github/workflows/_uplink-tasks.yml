# THE reusable per-Uplink task set. One invocation runs the whole lifecycle for
# ONE uplinks/<name>, and `ci.yml` / `publish.yml` invoke it in a matrix whose
# entries come from `scripts/uplink-matrix.mjs`.
#
# Every capability fact arrives as an input computed from disk by that script.
# Nothing here names an Uplink and nothing here infers a capability from a
# string: a GitHub Actions `if:` is a string comparison against a matrix value,
# so a condition that can never match reports as a correctly-skipped step, and a
# leg of skipped steps reports green having done nothing.
name: uplink-tasks

on:
  workflow_call:
    inputs:
      name: { required: true, type: string }
      id: { required: true, type: string }
      client: { required: true, type: boolean }
      mod_csproj: { required: true, type: string }
      tests_csproj: { required: true, type: string }
      codegen_csproj: { required: true, type: string }
      typecheck: { required: true, type: boolean }
      test: { required: true, type: boolean }
      bundle: { required: true, type: boolean }
      publish: { required: false, type: boolean, default: false }

jobs:
  uplink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }

      # The reference set an Uplink compiles against: KSP's own managed
      # assemblies, the GameData of the mod this Uplink wraps, and the Gonogo
      # contract and devkit. None of it is ours to redistribute and all four
      # directories are gitignored, so they are materialised here and then
      # CHECKED before anything compiles: MSB3245 is a WARNING, so a HintPath
      # that does not exist takes the assembly off the compile surface and the
      # build carries on and exits 0.
      #
      # Asked as its own step, before the checkout that would consume it,
      # because `actions/checkout` given an empty token reports a 404 on a
      # private repository and a 404 reads as "no such repo" rather than "no
      # credential". The commonest cause is not a missing secret at all: this is
      # a reusable workflow, and a caller that omits `secrets: inherit` hands
      # every secret through as the empty string.
      - name: Reference set credential
        env:
          KSP_MANAGED_TOKEN: ${{ secrets.KSP_MANAGED_TOKEN }}
        run: |
          if [ -z "$KSP_MANAGED_TOKEN" ]; then
            echo "::error title=No KSP_MANAGED_TOKEN::The KSP reference assemblies live in the private ksp-gonogo/ksp-managed, and this job has no credential for it. Either the organisation secret KSP_MANAGED_TOKEN is not visible to this repository, or the workflow calling _uplink-tasks.yml omits 'secrets: inherit'."
            exit 1
          fi

      # A PAT rather than the job's own GITHUB_TOKEN: that token is scoped to
      # this repository and ksp-managed is a different, private one.
      - name: Check out the KSP reference assemblies
        uses: actions/checkout@v4
        with:
          repository: ksp-gonogo/ksp-managed
          token: ${{ secrets.KSP_MANAGED_TOKEN }}
          path: .refs/ksp-managed
          persist-credentials: false

      # gonogo is public, so the job's own token reaches it. The vendor script
      # reads the commit with `git archive` and never the working tree, so
      # checkout's default depth-1 fetch is the whole of what it needs.
      #
      # `staging` and not the default branch. gonogo integrates on staging and
      # its main has not moved since July, so a default checkout lands on a tree
      # with no vendor script in it at all, and would have vendored a
      # months-stale contract if it had one.
      - name: Check out gonogo
        uses: actions/checkout@v4
        with:
          repository: ksp-gonogo/gonogo
          ref: staging
          path: .refs/gonogo
          persist-credentials: false

      # Every root lands at the `vendor/<x>` path Directory.Build.props already
      # defaults to, so no project needs a /p: override here that it would not
      # get on the author's own machine.
      - name: Resolve the reference set
        id: refs
        run: |
          set -euo pipefail
          vendor="$GITHUB_WORKSPACE/vendor"
          mkdir -p "$vendor"
          rm -rf "$vendor/ksp-managed" "$vendor/gamedata"
          cp -R "$GITHUB_WORKSPACE/.refs/ksp-managed/KSP_Data/Managed" "$vendor/ksp-managed"
          cp -R "$GITHUB_WORKSPACE/.refs/ksp-managed/GameData" "$vendor/gamedata"
          "$GITHUB_WORKSPACE/.refs/gonogo/scripts/vendor-uplinks-reference-set.sh" "$GITHUB_WORKSPACE"
          echo "gonogo_contract=$vendor/contract" >> "$GITHUB_OUTPUT"

      # The gate the MSB3245 warning is not. Every HintPath in this Uplink's own
      # projects names one of the four roots and nothing else, so expanding them
      # here covers the whole compile surface, and a hole is named with the
      # csproj that wanted it instead of arriving later as a CS0246 about a type
      # nobody deleted.
      - name: Every reference this Uplink names resolves
        run: |
          set -euo pipefail
          shopt -s nullglob
          missing=0
          for csproj in "uplinks/${{ inputs.name }}"/*/*.csproj; do
            while IFS= read -r hint; do
              path=$(printf '%s' "$hint" | sed \
                -e 's#\\#/#g' \
                -e 's#\$(GonogoContract)#vendor/contract#' \
                -e 's#\$(GonogoDevkit)#vendor/devkit#' \
                -e 's#\$(KspManaged)#vendor/ksp-managed#' \
                -e 's#\$(KspGameData)#vendor/gamedata#')
              if [ ! -f "$path" ]; then
                echo "::error file=$csproj::$hint is not in the reference set (looked for $path)"
                missing=$((missing + 1))
              fi
            done < <(grep -ho '<HintPath>[^<]*</HintPath>' "$csproj" | sed 's/<[^>]*>//g')
          done
          if [ "$missing" -ne 0 ]; then
            echo "$missing reference(s) this Uplink names are absent from the resolved set; see the annotations above."
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: inputs.client
        with: { node-version: "24" }

      - name: Install client dependencies
        if: inputs.client
        working-directory: uplinks/${{ inputs.name }}/client
        run: npm ci --no-audit --no-fund

      - name: Typecheck client
        if: inputs.typecheck
        working-directory: uplinks/${{ inputs.name }}/client
        run: npm run typecheck

      # Loadability is asked SEPARATELY from the tests, and in a bare node
      # process, because a green test run is not evidence of it: every client
      # sets `server.deps.inline` (it must, or ui-kit's bundle kills every test
      # file in setup), and inlining makes Vite perform the extension search Node
      # refuses to. A dependency no Node process can import passes vitest with
      # inlining on, which is how six weeks of an unimportable sdk went unnoticed.
      - name: Published dependencies load
        if: inputs.client
        run: node tooling/check-published-loadability.mjs "${{ inputs.name }}"

      - name: Test client
        if: inputs.test
        working-directory: uplinks/${{ inputs.name }}/client
        run: npm test

      # A `minSize` is the smallest tile the app will ever let an operator drag
      # a widget to, so it is a promise, and gonogo holds the widgets living
      # there to it. That gate reads its registration list from the bundle
      # targets precisely so an Uplink which LEAVES gonogo leaves the check
      # behind with it, which is why this side needs its own: without it the six
      # Uplinks already moved lost it at their removal commit, and every one
      # still to move would.
      #
      # The browser is the CLIENT's own playwright, for the reason the docs step
      # below gives: run from the repo root, npx finds none and fetches the
      # newest release, whose chromium revision is not the one the client's
      # locked playwright launches.
      - name: Widgets fit the minSize they declare
        if: inputs.client
        run: |
          (cd "uplinks/${{ inputs.name }}/client" && npm exec --no -- playwright install --with-deps chromium)
          node tooling/minsize-gate.mjs --only "${{ inputs.name }}"

      # The mode a client does not check is the one that fails silently:
      # `declare module` bindings resolve under bundler and not under nodenext, so
      # a Topic declaration merge vanishes and takes its keys with it. Zero
      # errors, red or green; see scripts/check-nodenext.mjs for why there is no
      # debt list and for the fault class this gate structurally cannot see.
      - name: Typecheck client under nodenext
        if: inputs.typecheck
        run: node scripts/check-nodenext.mjs "${{ inputs.name }}"

      # Codegen is verified rather than run: the generated TypeScript is
      # committed, so a slice whose C# moved without regenerating produces a
      # diff here instead of a client that types a payload the mod no longer
      # sends.
      - name: Codegen is current
        if: inputs.codegen_csproj != ''
        run: |
          node tooling/codegen-uplink.mjs "${{ inputs.name }}" \
            -p:GonogoContract="${{ steps.refs.outputs.gonogo_contract }}"
          git diff --exit-code -- "uplinks/${{ inputs.name }}/client/src/__generated__"

      # ClientSource.g.cs and ExpectedClientHash.g.cs are gitignored and a mod
      # that reads them does not compile without them, so they are baked first,
      # in the release shape with no hash: the bundle is not built until later.
      - name: Build mod
        if: inputs.mod_csproj != ''
        run: |
          node tooling/bake-client-source.mjs "${{ inputs.name }}"
          dotnet build "${{ inputs.mod_csproj }}" -c Release --nologo \
            -p:GonogoContract="${{ steps.refs.outputs.gonogo_contract }}"

      - name: Test mod
        if: inputs.tests_csproj != ''
        run: |
          dotnet test "${{ inputs.tests_csproj }}" -c Release --nologo \
            -p:GonogoContract="${{ steps.refs.outputs.gonogo_contract }}"

      # The parent mod's version, read from THIS Uplink's own uplink.json rather
      # than from anything central. `mod.tier` decides whether a newer published
      # version can be discovered at all; see tooling/check-mod-version.mjs.
      - name: Parent mod version
        run: node tooling/check-mod-version.mjs "${{ inputs.name }}"

      - name: Bundle client
        if: inputs.bundle
        run: node tooling/bundle-uplink-client.mjs "${{ inputs.name }}"

      - name: Package mod
        if: inputs.mod_csproj != ''
        run: node tooling/package-uplink-mod.mjs "${{ inputs.name }}"

      # Gated on `client` and nothing else. It used to be gated on a `docs_check`
      # input derived from a `docs:check` script, and the example Uplink HAD that
      # script and no page, so the leg asked whether a page it did not have had
      # drifted and reported green. A gate you opt into describes whoever
      # remembered.
      #
      # Through `tooling/uplink-docs.mjs --only` rather than the CLI directly, so
      # `RENDER_DEBT` applies here too: an Uplink whose render is known-broken
      # would otherwise make this leg permanently red, and a permanently-red leg
      # hides the next real failure behind it.
      #
      # The browser is installed by the CLIENT's own playwright. Run from the repo
      # root, npx finds none and fetches the newest release, whose chromium
      # revision is not the one the client's locked playwright launches, so the
      # render dies at `browserType.launch: Executable doesn't exist`. `--no`
      # refuses that fetch rather than installing the wrong revision.
      - name: Docs are current
        if: inputs.client
        run: |
          (cd "uplinks/${{ inputs.name }}/client" && npm exec --no -- playwright install --with-deps chromium)
          node tooling/uplink-docs.mjs --check --only "${{ inputs.name }}"

      # The check renders into a throwaway directory, so when it fails the
      # pictures that would explain why are already gone. Rendered again here,
      # into what the upload below carries. Best effort: a leg that failed before
      # the docs check may have nothing to render with, and that must not bury
      # the failure that actually happened.
      - name: Keep the renders of a failed docs check
        if: failure() && inputs.client
        continue-on-error: true
        run: |
          (cd "uplinks/${{ inputs.name }}/client" && npm exec --no -- gonogo-uplink render --out "$GITHUB_WORKSPACE/artifacts/renders-${{ inputs.id }}")

      # Uploaded on failure as well as success: a leg that fails is the one whose
      # output someone needs to read, and a success-only upload throws exactly
      # that away. Named -FAILED so a red run's artefact stands out among green
      # ones. A failed leg may have died before writing anything, so an empty
      # directory is only an error on a leg that passed.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uplink-${{ inputs.id }}${{ failure() && '-FAILED' || '' }}
          path: artifacts/
          if-no-files-found: ${{ failure() && 'warn' || 'error' }}
