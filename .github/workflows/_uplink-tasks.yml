# THE reusable per-Uplink task set. One invocation runs the whole lifecycle for
# ONE uplinks/<name>, and `ci.yml` / `release.yml` invoke it in a matrix whose
# entries come from `scripts/uplink-matrix.mjs`.
#
# Every capability fact arrives as an input computed from disk by that script.
# Nothing here names an Uplink and nothing here infers a capability from a
# string: a GitHub Actions `if:` is a string comparison against a matrix value,
# so a condition that can never match reports as a correctly-skipped step, and a
# leg of skipped steps reports green having done nothing.
name: uplink-tasks

on:
  workflow_call:
    inputs:
      name: { required: true, type: string }
      id: { required: true, type: string }
      client: { required: true, type: boolean }
      mod_csproj: { required: true, type: string }
      tests_csproj: { required: true, type: string }
      codegen_csproj: { required: true, type: string }
      devtools_csproj: { required: false, type: string, default: "" }
      typecheck: { required: true, type: boolean }
      test: { required: true, type: boolean }
      bundle: { required: true, type: boolean }
      publish: { required: false, type: boolean, default: false }
      scaffold: { required: false, type: boolean, default: false }
      # Set by rc-check.yml only: build this Uplink against the PUBLISHED
      # packages at exactly this version, not the tarballs vendored from a gonogo
      # sha. Empty on every ordinary run.
      packages_version: { required: false, type: string, default: "" }
      # The release's version, from its tag. Every manifest reports it. Empty on
      # a build that is not a release, which reports 0.0.0-dev.
      version: { required: false, type: string, default: "" }

jobs:
  uplink:
    runs-on: ubuntu-latest
    env:
      GONOGO_UPLINK_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }

      # The reference set an Uplink compiles against that is NOT ours: KSP's own
      # managed assemblies and the GameData of the mod this Uplink wraps. Neither
      # is ours to redistribute and both directories are gitignored, so they are
      # materialised here and then
      # CHECKED before anything compiles: MSB3245 is a WARNING, so a HintPath
      # that does not exist takes the assembly off the compile surface and the
      # build carries on and exits 0.
      #
      # Asked as its own step, before the checkout that would consume it,
      # because `actions/checkout` given an empty token reports a 404 on a
      # private repository and a 404 reads as "no such repo" rather than "no
      # credential". The commonest cause is not a missing secret at all: this is
      # a reusable workflow, and a caller that omits `secrets: inherit` hands
      # every secret through as the empty string.
      - name: Reference set credential
        env:
          KSP_MANAGED_TOKEN: ${{ secrets.KSP_MANAGED_TOKEN }}
        run: |
          if [ -z "$KSP_MANAGED_TOKEN" ]; then
            echo "::error title=No KSP_MANAGED_TOKEN::The KSP reference assemblies live in the private ksp-gonogo/ksp-managed, and this job has no credential for it. Either the organisation secret KSP_MANAGED_TOKEN is not visible to this repository, or the workflow calling _uplink-tasks.yml omits 'secrets: inherit'."
            exit 1
          fi

      # A PAT rather than the job's own GITHUB_TOKEN: that token is scoped to
      # this repository and ksp-managed is a different, private one.
      - name: Check out the KSP reference assemblies
        uses: actions/checkout@v4
        with:
          repository: ksp-gonogo/ksp-managed
          token: ${{ secrets.KSP_MANAGED_TOKEN }}
          path: .refs/ksp-managed
          persist-credentials: false

      # Every root lands at the `vendor/<x>` path Directory.Build.props already
      # defaults to, so no project needs a /p: override here that it would not
      # get on the author's own machine.
      - name: Resolve the reference set
        id: refs
        run: |
          set -euo pipefail
          vendor="$GITHUB_WORKSPACE/vendor"
          mkdir -p "$vendor"
          rm -rf "$vendor/ksp-managed" "$vendor/gamedata"
          cp -R "$GITHUB_WORKSPACE/.refs/ksp-managed/KSP_Data/Managed" "$vendor/ksp-managed"
          cp -R "$GITHUB_WORKSPACE/.refs/ksp-managed/GameData" "$vendor/gamedata"

      # The gate the MSB3245 warning is not. Every HintPath in this Uplink's own
      # projects names one of the two roots, or the codegen twin the contract
      # package carries, so expanding the roots here covers everything that is
      # not a package, and a hole is named with the
      # csproj that wanted it instead of arriving later as a CS0246 about a type
      # nobody deleted.
      - name: Every reference this Uplink names resolves
        run: |
          set -euo pipefail
          shopt -s nullglob
          missing=0
          for csproj in "uplinks/${{ inputs.name }}"/*/*.csproj; do
            while IFS= read -r hint; do
              # The codegen twin of the contract comes out of the NuGet package,
              # at a path only `uplink-tools codegen` knows once the package is
              # restored. That command refuses a folder that does not hold it,
              # so it is checked there and not here.
              case "$hint" in '$(GonogoCodegen)'*) continue ;; esac
              path=$(printf '%s' "$hint" | sed \
                -e 's#\\#/#g' \
                -e 's#\$(KspManaged)#vendor/ksp-managed#' \
                -e 's#\$(KspGameData)#vendor/gamedata#')
              if [ ! -f "$path" ]; then
                echo "::error file=$csproj::$hint is not in the reference set (looked for $path)"
                missing=$((missing + 1))
              fi
            done < <(grep -ho '<HintPath>[^<]*</HintPath>' "$csproj" | sed 's/<[^>]*>//g')
          done
          if [ "$missing" -ne 0 ]; then
            echo "$missing reference(s) this Uplink names are absent from the resolved set; see the annotations above."
            exit 1
          fi

      # The version uplink.json says the mod was built against is the version of
      # the mod assembly in the reference set, and of the npm client the Uplink
      # depends on, because the internal .ckan asks CKAN for exactly that.
      - name: builtAgainst is the version this Uplink builds against
        run: node tooling/check-built-against.mjs "${{ inputs.name }}"

      # Edits this runner's checkout and nothing that is committed. Before the
      # first restore of either ecosystem, so every later step sees the published
      # packages. The vendored lockfiles go with the file: pins, hence `npm install`.
      - name: Use the published packages
        if: inputs.packages_version != ''
        run: node tooling/use-published-packages.mjs "${{ inputs.packages_version }}"

      - uses: actions/setup-node@v4
        if: inputs.client
        with: { node-version: "24" }

      - name: Install client dependencies
        if: inputs.client
        working-directory: uplinks/${{ inputs.name }}/client
        run: |
          if [ -n "${{ inputs.packages_version }}" ]; then
            npm install --no-audit --no-fund
          else
            npm ci --no-audit --no-fund
          fi

      # A committed page records the sdk version that wrote it and the files that
      # sdk writes, so a build against any other package version fails the page
      # test for that reason alone. Under rc-check the page is rewritten by the
      # candidate's own tools first, and the test then proves the code still
      # describes itself. The step names what it wrote: a file listed here that
      # main does not carry (a new generated file) is what the next re-pin commits.
      - name: Write the page the published tools generate
        if: inputs.packages_version != '' && inputs.client
        run: node tooling/uplink-tools.mjs "${{ inputs.name }}" page

      - name: Typecheck client
        if: inputs.typecheck
        working-directory: uplinks/${{ inputs.name }}/client
        run: npm run typecheck

      - name: Test client
        if: inputs.test
        working-directory: uplinks/${{ inputs.name }}/client
        run: npm test

      # Codegen is verified rather than run: the generated TypeScript is
      # committed, so a slice whose C# moved without regenerating fails here
      # instead of shipping a client that types a payload the mod no longer
      # sends. `codegen --check` generates into a scratch directory and compares,
      # against the contract package the slice itself restored.
      - name: Codegen is current
        if: inputs.codegen_csproj != ''
        run: node tooling/uplink-tools.mjs "${{ inputs.name }}" codegen --check

      # ClientSource.g.cs and ExpectedClientHash.g.cs are gitignored and a mod
      # that reads them does not compile without them, so they are baked first,
      # in the release shape with no hash: the bundle is not built until later.
      - name: Build mod
        if: inputs.mod_csproj != '' && !inputs.publish
        run: |
          node tooling/uplink-tools.mjs "${{ inputs.name }}" bake
          dotnet build "${{ inputs.mod_csproj }}" -c Release --nologo

      # Every check group of `uplink-tools check`, with no `--only`, so a group
      # added to the tool runs here without this file changing. It covers what the
      # single-group steps used to: published dependencies importable in a bare node
      # process (a green test run is no evidence of that, since every client inlines
      # ui-kit and Vite then does the extension search Node refuses to), the
      # nodenext typecheck (`declare module` bindings resolve under bundler and not
      # under nodenext, so a Topic merge vanishes silently), every widget fitting
      # the `minSize` it declares in a real browser, and the parent mod's version
      # being declared.
      #
      # `bake/stale` compares the baked hash against the client as it builds now, so
      # the hash-less bake above is not what it accepts: the client is bundled and
      # that bundle baked first. A release build bakes its own afterwards.
      #
      # The browser is the CLIENT's own playwright, for the reason the docs step
      # below gives. `minsize` measures pixels and only answers honestly on Linux.
      - name: Full uplink-tools check
        run: |
          if [ "${{ inputs.client }}" = "true" ]; then
            (cd "uplinks/${{ inputs.name }}/client" && npm exec --no -- playwright install --with-deps chromium)
            if [ -n "${{ inputs.mod_csproj }}" ]; then
              node tooling/uplink-tools.mjs "${{ inputs.name }}" bundle --out "$RUNNER_TEMP/check-bundle"
              node tooling/uplink-tools.mjs "${{ inputs.name }}" bake --bundle "$(ls "$RUNNER_TEMP"/check-bundle/*/*.client.js | head -1)"
            fi
          fi
          node tooling/uplink-tools.mjs "${{ inputs.name }}" check

      # A release DLL vouches for its client by carrying the bundle's sha256, so
      # the bundle is built and hashed before the DLL compiles, and packaged from
      # that same compile. The tests below then run against the DLL that ships.
      - name: Build the release pair
        if: inputs.publish
        run: node tooling/uplink-tools.mjs "${{ inputs.name }}" release --out "$GITHUB_WORKSPACE/artifacts"

      # CKAN reads this file out of the SpaceDock archive and adds its `depends`
      # to the listing, so the mod version an Uplink needs travels with the zip.
      - name: Write the internal .ckan into the mod zip
        if: inputs.publish && inputs.mod_csproj != ''
        run: node tooling/internal-ckan.mjs "${{ inputs.name }}" --zip "$(ls "$GITHUB_WORKSPACE"/artifacts/*.zip | head -1)"

      # Rig-only tools that reach their mod by reflection. Nothing packages them,
      # so this build is the only thing that notices when one stops compiling.
      - name: Build dev tools
        if: inputs.devtools_csproj != '' && !inputs.publish
        run: dotnet build "${{ inputs.devtools_csproj }}" -c Release --nologo

      - name: Test mod
        if: inputs.tests_csproj != ''
        run: |
          dotnet test "${{ inputs.tests_csproj }}" -c Release --nologo

      # `uplink-tools new` is held to producing an Uplink that builds: scaffold
      # one beside the real ones with this leg's own CLI, and run the commands
      # its closing message names, through to a release. Run on one leg only, since it
      # proves the scaffold and the pinned toolchain rather than any one Uplink,
      # and it deletes what it made.
      - name: Scaffold proof
        if: inputs.scaffold
        run: scripts/scaffold-proof.sh "${{ inputs.name }}"

      - name: Bundle client
        if: inputs.bundle && !inputs.publish
        run: node tooling/uplink-tools.mjs "${{ inputs.name }}" bundle --out "$GITHUB_WORKSPACE/artifacts"

      - name: Package mod
        if: inputs.mod_csproj != '' && !inputs.publish
        run: node tooling/uplink-tools.mjs "${{ inputs.name }}" package --out "$GITHUB_WORKSPACE/artifacts"

      # Gated on `client` and nothing else. It used to be gated on a `docs_check`
      # input derived from a `docs:check` script, and the example Uplink HAD that
      # script and no page, so the leg asked whether a page it did not have had
      # drifted and reported green. A gate you opt into describes whoever
      # remembered.
      #
      # Through `tooling/uplink-docs.mjs --only` rather than the CLI directly, so
      # `RENDER_DEBT` applies here too: an Uplink whose render is known-broken
      # would otherwise make this leg permanently red, and a permanently-red leg
      # hides the next real failure behind it.
      #
      # The browser is installed by the CLIENT's own playwright. Run from the repo
      # root, npx finds none and fetches the newest release, whose chromium
      # revision is not the one the client's locked playwright launches, so the
      # render dies at `browserType.launch: Executable doesn't exist`. `--no`
      # refuses that fetch rather than installing the wrong revision.
      #
      # Blocking on a pull request and on a release, red but not failing on a
      # branch push. A push that moves a picture is healed by `uplink-docs.yml`,
      # whose GITHUB_TOKEN commit starts no run of this workflow, so a blocking
      # check here would leave main red after the heal until the next push.
      - name: Docs are current
        id: docs
        if: inputs.client
        continue-on-error: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}
        run: |
          (cd "uplinks/${{ inputs.name }}/client" && npm exec --no -- playwright install --with-deps chromium)
          node tooling/uplink-docs.mjs --check --only "${{ inputs.name }}"

      # The check renders into a throwaway directory, so when it fails the
      # pictures that would explain why are already gone. Rendered again here,
      # into what the upload below carries. Best effort: a leg that failed before
      # the docs check may have nothing to render with, and that must not bury
      # the failure that actually happened.
      - name: Keep the renders of a failed docs check
        if: (failure() || steps.docs.outcome == 'failure') && inputs.client
        continue-on-error: true
        run: |
          (cd "uplinks/${{ inputs.name }}/client" && npm exec --no -- uplink-tools render --out "$GITHUB_WORKSPACE/artifacts/renders-${{ inputs.id }}")

      # Uploaded on failure as well as success: a leg that fails is the one whose
      # output someone needs to read, and a success-only upload throws exactly
      # that away. Named -FAILED so a red run's artefact stands out among green
      # ones. A failed leg may have died before writing anything, so an empty
      # directory is only an error on a leg that passed.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uplink-${{ inputs.id }}${{ (job.status == 'failure' || steps.docs.outcome == 'failure') && '-FAILED' || '' }}
          path: artifacts/
          if-no-files-found: ${{ (job.status == 'failure' || steps.docs.outcome == 'failure') && 'warn' || 'error' }}
