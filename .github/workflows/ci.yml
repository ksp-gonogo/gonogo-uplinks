name: ci

# `staging` is where all work lands and `main` moves only at a release, so both
# run in full. A pull request targets `staging`: nothing reaches `main` but a
# release.
on:
  push: { branches: [main, staging] }
  pull_request: { branches: [staging] }
  # `prepare-release.yml` runs this on the staging commit it prepared before the
  # tags go on it and `main` moves to it. It names the Uplinks being released,
  # so a release is held to the checks about the repo and to the legs of those
  # Uplinks, and no other Uplink's leg.
  workflow_call:
    inputs:
      ref:
        description: The commit to check.
        required: true
        type: string
      uplinks:
        description: Uplink ids, comma separated, whose legs run. Empty runs every leg.
        required: false
        type: string
        default: ""
      scope:
        description: >-
          all runs the repo-wide checks, the scaffold proof and the legs. shared
          runs the first two only and legs runs the legs only, with a marker
          artifact when they pass, so a release can run each Uplink's legs beside
          the others' and tag exactly the ones that passed.
        required: false
        type: string
        default: all

jobs:
  # Discovery is its own job so a broken walk fails HERE with a message, rather
  # than emitting an empty matrix. GitHub Actions skips a job whose matrix is
  # empty, and a skipped matrix job reports as successful, so every Uplink's CI
  # would go green at once. `scripts/uplink-matrix.mjs` carries the floor that
  # refuses to emit nothing.
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      scaffold_sibling: ${{ steps.sibling.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref }}", fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - id: matrix
        env:
          UPLINKS: ${{ inputs.uplinks }}
          SCOPE: ${{ inputs.scope }}
        run: |
          if [ "$SCOPE" = shared ]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
          else
            node scripts/uplink-matrix.mjs --github --only "$UPLINKS" >> "$GITHUB_OUTPUT"
          fi
      - id: sibling
        run: echo "name=$(node scripts/uplink-matrix.mjs --scaffold-sibling)" >> "$GITHUB_OUTPUT"
      - if: inputs.scope != 'legs'
        run: node scripts/uplink-matrix.mjs
      # The repo's front door describes the repo. Generated from the same
      # uplink.json files the matrix reads, so it cannot drift into describing a
      # set of Uplinks that no longer exists.
      - if: inputs.scope != 'legs'
        run: node tooling/generate-root-readme.mjs --check
      # Does every client-bearing Uplink HAVE a generated page. A second's worth
      # of filesystem, and here rather than in a leg because it is a question
      # about the SET: a leg can only report on itself, and the failure this
      # catches is an Uplink nobody wrote a page for. Whether each page is
      # CURRENT is the leg's question, and needs a browser.
      #
      # It plants three trees and proves it can see a missing page before
      # reporting on the real ones, and refuses if discovery hands it nothing.
      - if: inputs.scope != 'legs'
        run: node tooling/uplink-docs.mjs --gate
      # Are the vendored artefacts every client installs from actually HERE, and
      # does each Uplink resolve the bytes its own lockfile describes. Here
      # rather than in a leg because it is a question about the SET: the failure
      # it catches is one Uplink's refresh re-pointing another, which no leg
      # looking only at itself can see. It is also the cheapest possible early
      # warning, a second of hashing before twelve legs each spend a minute
      # discovering the same missing tarball at `npm ci`.
      - if: inputs.scope != 'legs'
        run: node scripts/check-vendor-pins.mjs
      # Does every Uplink that ships a client give its manifest a ClientSource.
      # A question about the SET, and a null one compiles and loads in game with
      # the client never fetched. Plants a violation and fails as BLIND if unseen.
      - if: inputs.scope != 'legs'
        run: node tooling/check-client-source.mjs
      # Is any assistant working-notes or tool-config file tracked. The
      # repo is public. Plants a violation and fails as BLIND if unseen.
      - if: inputs.scope != 'legs'
        run: node tooling/check-private-notes.mjs
      # Does each commit a push or pull request adds name the Uplinks it
      # touches. The same module the commit-msg hook runs, over commits after
      # the sha named in tooling/commit-scope.mjs.
      - if: inputs.ref == '' && inputs.scope != 'legs'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tooling/commit-scope.mjs --since "$BASE" --to "$HEAD_SHA"
      - if: inputs.scope != 'legs'
        run: node --test "tooling/*.test.mjs"

  # Does every Uplink here register what it declares, and declare what it
  # registers. A question about the SET, so not a leg of `_uplink-tasks.yml`: the
  # guard this restores was a per-project one in `gonogo`, and a per-project
  # guard is the thing that gets forgotten. It was forgotten by exactly the
  # Uplinks that moved here, because `gonogo`'s walk enrols an Uplink by its
  # living under that repo's `mod/` and departure took these three out of reach.
  #
  # Its own job rather than a step of `discover`, which every leg waits on: this
  # needs the dotnet SDK, and paying for that in front of the matrix delays every
  # Uplink's build to answer a question none of them asked.
  wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      # The walk is vendored from `gonogo` verbatim. Checked BEFORE it runs: a
      # hand-edit here forks the gate into two that agree until one stops
      # matching a registration shape, and a walk that matches nothing reports a
      # clean repo rather than going red.
      - run: node tooling/check-wiring-walk.mjs
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      # No reference set, unlike every other dotnet step in this repo: the walk
      # reads `.cs` off disk with System.IO. That is what lets it BLOCK from a
      # bare checkout instead of waiting on vendored assemblies a runner has no
      # way to obtain.
      - run: dotnet test tooling/wiring/Gonogo.UplinkWiring.Tests.csproj -c Release --nologo

  uplink:
    needs: discover
    if: inputs.scope != 'shared'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/_uplink-tasks.yml
    # A reusable workflow inherits no secret by default, and an omitted secret
    # arrives as the empty string rather than as an error, so without this the
    # reference-set checkout would 404 on a repository that is plainly there.
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}
      name: ${{ matrix.name }}
      id: ${{ matrix.id }}
      client: ${{ matrix.client }}
      mod_csproj: ${{ matrix.mod_csproj }}
      tests_csproj: ${{ matrix.tests_csproj }}
      codegen_csproj: ${{ matrix.codegen_csproj }}
      devtools_csproj: ${{ matrix.devtools_csproj }}
      typecheck: ${{ matrix.typecheck }}
      test: ${{ matrix.test }}
      bundle: ${{ matrix.bundle }}

  # `uplink-tools new` is held to producing an Uplink that builds: scaffold one
  # beside the real ones with a sibling's own CLI, and run the commands its
  # closing message names, through to a release. It proves the scaffold and the
  # pinned toolchain rather than any one Uplink, so it gates every release and
  # sits in no Uplink's leg.
  scaffold:
    needs: discover
    if: inputs.scope != 'legs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref }}" }
      - uses: ./.github/actions/setup-dotnet-direct
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: Install the sibling's client dependencies
        working-directory: uplinks/${{ needs.discover.outputs.scaffold_sibling }}/client
        run: npm ci --no-audit --no-fund
      - name: Scaffold proof
        run: scripts/scaffold-proof.sh "${{ needs.discover.outputs.scaffold_sibling }}"

  # Written only by a `legs` run whose Uplink passed, so the release that called
  # it can tell which Uplinks may be tagged. A reusable workflow reports one
  # result however many legs it ran, and an artifact is the one thing it can hand
  # back by name.
  passed:
    needs: [discover, uplink]
    if: ${{ !cancelled() && inputs.scope == 'legs' && needs.discover.result == 'success' && needs.uplink.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          UPLINKS: ${{ inputs.uplinks }}
        run: echo "$UPLINKS" > passed.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ci-passed-${{ inputs.uplinks }}
          path: passed.txt
