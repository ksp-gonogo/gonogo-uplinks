name: ci

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  # Discovery is its own job so a broken walk fails HERE with a message, rather
  # than emitting an empty matrix. GitHub Actions skips a job whose matrix is
  # empty, and a skipped matrix job reports as successful, so every Uplink's CI
  # would go green at once. `scripts/uplink-matrix.mjs` carries the floor that
  # refuses to emit nothing.
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - id: matrix
        run: node scripts/uplink-matrix.mjs --github >> "$GITHUB_OUTPUT"
      - run: node scripts/uplink-matrix.mjs
      # The repo's front door describes the repo. Generated from the same
      # uplink.json files the matrix reads, so it cannot drift into describing a
      # set of Uplinks that no longer exists.
      - run: node tooling/generate-root-readme.mjs --check
      # Does every client-bearing Uplink HAVE a generated page. A second's worth
      # of filesystem, and here rather than in a leg because it is a question
      # about the SET: a leg can only report on itself, and the failure this
      # catches is an Uplink nobody wrote a page for. Whether each page is
      # CURRENT is the leg's question, and needs a browser.
      #
      # It plants three trees and proves it can see a missing page before
      # reporting on the real ones, and refuses if discovery hands it nothing.
      - run: node tooling/uplink-docs.mjs --gate

  uplink:
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/_uplink-tasks.yml
    with:
      name: ${{ matrix.name }}
      id: ${{ matrix.id }}
      client: ${{ matrix.client }}
      mod_csproj: ${{ matrix.mod_csproj }}
      tests_csproj: ${{ matrix.tests_csproj }}
      codegen_csproj: ${{ matrix.codegen_csproj }}
      typecheck: ${{ matrix.typecheck }}
      test: ${{ matrix.test }}
      bundle: ${{ matrix.bundle }}
