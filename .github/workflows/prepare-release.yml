# Cuts a release of one or more Uplinks, from `staging`.
#
#   gh workflow run prepare-release.yml --ref staging -f uplinks=kerbcast [-f full=true] [-f dry_run=true]
#
# All work lands on `staging`. Nothing is committed to cut a release: an Uplink's
# committed files hold the placeholder version 0.0.0-development, the version is
# the tag, and the release's own build stamps it into the checkout it builds from.
#
#   1. plan: refuses any ref but staging, refuses when main cannot fast-forward to
#      it, refuses a full release unless the operator has set ALLOW_FULL_RELEASE,
#      and works out which Uplinks to release
#   2. prepare: one leg per Uplink runs `uplink-tools release prepare` on the
#      staging head. The next version comes from that Uplink's own newest tag
#      (`--from`) and its own commits, is stamped over the placeholder in the
#      leg's checkout, and the same checks a release is held to run, ending in a
#      full release build into a scratch folder. A leg commits and pushes
#      nothing, and uploads the version and tag it settled on. Every leg runs, so
#      one failure is reported beside the others, and any failure stops the release
#   3. settle: gathers the legs' tags
#   4. ci: ci.yml on the staging head the legs prepared, with the repo-wide
#      checks, the scaffold proof and the legs of the chosen Uplinks only
#   5. release: only when ci is green, the tags go on that commit and main
#      fast-forwards to it, in one atomic push, and release.yml is dispatched on
#      each tag. release.yml builds each tag stamped with its own version
#
# A tag exists only after every check has passed on the commit it names, and the
# commit is the one that was checked even when staging has moved on during the
# run. `dry_run` runs steps 1 to 3 and prints the tags, and pushes nothing.
#
# If release.yml fails after its tag exists, run it again on that tag:
#   gh workflow run release.yml --ref <tag>
name: prepare-release

on:
  workflow_dispatch:
    inputs:
      uplinks:
        description: Uplink ids, comma separated, or all
        type: string
        default: all
      bump:
        description: >-
          The version each Uplink moves to. auto reads it from the Uplink's own
          commits; rc is its next candidate
        type: choice
        options: [auto, rc, patch, minor, major]
        default: auto
      version:
        description: >-
          One exact version for every chosen Uplink, instead of bump. A
          candidate is 1.0.0-rc.5
        type: string
        default: ""
      full:
        description: >-
          A full release, not a candidate. Refused unless the operator has set
          ALLOW_FULL_RELEASE
        type: boolean
        default: false
      dry_run:
        description: Run the preparation and show the commit and tags. Pushes nothing
        type: boolean
        default: false

permissions:
  contents: read

# Two runs would each prepare from the same head and one push would be rejected
# after its legs had paid for the build.
concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      args: ${{ steps.plan.outputs.args }}
      ids: ${{ steps.plan.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Only staging is released from
        run: |
          if [ "$GITHUB_REF" != refs/heads/staging ]; then
            echo "::error::A release starts on staging, and this was dispatched on $GITHUB_REF. Run it with --ref staging."
            exit 1
          fi

      - name: main can fast-forward to staging
        run: |
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main has commits staging does not, so main cannot fast-forward to a release made on staging. Merge main into staging first."
            exit 1
          fi

      # The operator's switch, read before anything is planned or built. A
      # candidate needs none.
      - name: A full release is the operator's
        if: inputs.full
        env:
          ALLOW_FULL_RELEASE: ${{ vars.ALLOW_FULL_RELEASE }}
        run: |
          if [ "$ALLOW_FULL_RELEASE" != true ]; then
            echo "::error::A full release is the operator's to make, and ALLOW_FULL_RELEASE is not true. Nothing was prepared."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with: { node-version: "24" }

      - id: plan
        env:
          UPLINKS: ${{ inputs.uplinks }}
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
          FULL: ${{ inputs.full }}
        run: >-
          node tooling/release-plan.mjs plan
          --uplinks "$UPLINKS" --bump "$BUMP" --version "$VERSION" --full "$FULL"
          --github >> "$GITHUB_OUTPUT"

  prepare:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/_uplink-tasks.yml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      name: ${{ matrix.name }}
      id: ${{ matrix.id }}
      client: ${{ matrix.client }}
      mod_csproj: ${{ matrix.mod_csproj }}
      tests_csproj: ${{ matrix.tests_csproj }}
      codegen_csproj: ${{ matrix.codegen_csproj }}
      devtools_csproj: ${{ matrix.devtools_csproj }}
      typecheck: ${{ matrix.typecheck }}
      test: ${{ matrix.test }}
      bundle: ${{ matrix.bundle }}
      prepare_args: ${{ needs.plan.outputs.args }}

  settle:
    needs: [plan, prepare]
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: "24" }

      - uses: actions/download-artifact@v4
        with:
          pattern: uplink-*
          path: ${{ runner.temp }}/legs
          merge-multiple: true

      - id: tags
        run: |
          set -euo pipefail
          legs="$RUNNER_TEMP/legs"
          tags="$(node -e '
            const fs = require("fs");
            const dir = process.argv[1];
            const released = fs.readdirSync(dir).filter((f) => /^prepare-.*\.json$/.test(f))
              .map((f) => JSON.parse(fs.readFileSync(dir + "/" + f, "utf8")))
              .sort((a, b) => a.id.localeCompare(b.id));
            console.log(JSON.stringify(released.map((r) => r.id + "-v" + r.version)));
          ' "$legs")"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          {
            echo "### Tags on $GITHUB_SHA"
            echo
            echo "$tags"
          } >> "$GITHUB_STEP_SUMMARY"

  ci:
    needs: [plan, settle]
    if: inputs.dry_run == false
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      uplinks: ${{ needs.plan.outputs.ids }}

  release:
    needs: [settle, ci]
    if: inputs.dry_run == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # main moves to the commit that was checked and the tags go with it, in one push
      # that either lands whole or not at all.
      - name: main moves to the checked commit
        env:
          TAGS: ${{ needs.settle.outputs.tags }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor origin/main "$sha"; then
            echo "::error::main is no longer an ancestor of the checked commit, so it cannot fast-forward. Nothing was pushed."
            exit 1
          fi
          refs=()
          for tag in $(echo "$TAGS" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf8")).sort().join(" "))'); do
            git tag "$tag" "$sha"
            refs+=("refs/tags/$tag")
          done
          git push --atomic origin "$sha:refs/heads/main" "${refs[@]}"

      # A push made with this job's token starts no workflow, so each tag's
      # release is started on the tag's own ref. release.yml serialises the
      # publishing.
      - name: Start each release
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ needs.settle.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $(echo "$TAGS" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf8")).sort().join(" "))'); do
            gh workflow run release.yml --ref "$tag"
            echo "started release.yml on $tag"
          done
