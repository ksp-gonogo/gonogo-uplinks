# Cuts a release of one or more Uplinks, from `staging`.
#
#   gh workflow run prepare-release.yml --ref staging -f uplinks=kerbcast [-f full=true] [-f dry_run=true]
#
# All work lands on `staging`. Nothing is committed to cut a release: an Uplink's
# committed files hold the placeholder version 0.0.0-development, the version is
# the tag, and the release's own build stamps it into the checkout it builds from.
#
#   1. plan: refuses any ref but staging, refuses when main cannot fast-forward to
#      it, refuses a full release unless the operator has set ALLOW_FULL_RELEASE,
#      and works out which Uplinks to release
#   2. prepare: one leg per Uplink runs `uplink-tools release prepare` on the
#      staging head. The next version comes from that Uplink's own newest tag
#      (`--from`) and its own commits, is stamped over the placeholder in the
#      leg's checkout, and the same checks a release is held to run, ending in a
#      full release build into a scratch folder. A leg commits and pushes
#      nothing, and uploads the version and tag it settled on. Every leg runs, so
#      one failure is reported beside the others and stops only its own Uplink
#   3. settle: gathers the tags of the legs that passed
#   4. ci-shared: the repo-wide checks and the scaffold proof, on the staging head
#      the legs prepared. A failure here is about the repository and stops all
#   5. ci: one run of ci.yml per Uplink, with only that Uplink's legs
#   6. release: the Uplinks whose prepare leg and legs both passed are tagged on
#      that commit and main fast-forwards to it, in one atomic push, and
#      release.yml is dispatched on each tag. An Uplink that failed is named and
#      makes the run red, and holds back no other. release.yml builds each tag
#      stamped with its own version
#
# A tag exists only after every check has passed on the commit it names, and the
# commit is the one that was checked even when staging has moved on during the
# run. `dry_run` runs steps 1 to 3 and prints the tags, and pushes nothing.
#
# If release.yml fails after its tag exists, run it again on that tag:
#   gh workflow run release.yml --ref <tag>
name: prepare-release

on:
  workflow_dispatch:
    inputs:
      uplinks:
        description: Uplink ids, comma separated, or all
        type: string
        default: all
      bump:
        description: >-
          The version each Uplink moves to. auto reads it from the Uplink's own
          commits; rc is its next candidate
        type: choice
        options: [auto, rc, patch, minor, major]
        default: auto
      version:
        description: >-
          One exact version for every chosen Uplink, instead of bump. A
          candidate is 1.0.0-rc.5
        type: string
        default: ""
      full:
        description: >-
          A full release, not a candidate. Refused unless the operator has set
          ALLOW_FULL_RELEASE
        type: boolean
        default: false
      dry_run:
        description: Run the preparation and show the commit and tags. Pushes nothing
        type: boolean
        default: false

permissions:
  contents: read

# Two runs would each prepare from the same head and one push would be rejected
# after its legs had paid for the build.
concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      args: ${{ steps.plan.outputs.args }}
      ids: ${{ steps.plan.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Only staging is released from
        run: |
          if [ "$GITHUB_REF" != refs/heads/staging ]; then
            echo "::error::A release starts on staging, and this was dispatched on $GITHUB_REF. Run it with --ref staging."
            exit 1
          fi

      - name: main can fast-forward to staging
        run: |
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main has commits staging does not, so main cannot fast-forward to a release made on staging. Merge main into staging first."
            exit 1
          fi

      # The operator's switch, read before anything is planned or built. A
      # candidate needs none.
      - name: A full release is the operator's
        if: inputs.full
        env:
          ALLOW_FULL_RELEASE: ${{ vars.ALLOW_FULL_RELEASE }}
        run: |
          if [ "$ALLOW_FULL_RELEASE" != true ]; then
            echo "::error::A full release is the operator's to make, and ALLOW_FULL_RELEASE is not true. Nothing was prepared."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with: { node-version: "24" }

      - id: plan
        env:
          UPLINKS: ${{ inputs.uplinks }}
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
          FULL: ${{ inputs.full }}
        run: >-
          node tooling/release-plan.mjs plan
          --uplinks "$UPLINKS" --bump "$BUMP" --version "$VERSION" --full "$FULL"
          --github >> "$GITHUB_OUTPUT"

  prepare:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/_uplink-tasks.yml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      name: ${{ matrix.name }}
      id: ${{ matrix.id }}
      client: ${{ matrix.client }}
      mod_csproj: ${{ matrix.mod_csproj }}
      tests_csproj: ${{ matrix.tests_csproj }}
      codegen_csproj: ${{ matrix.codegen_csproj }}
      devtools_csproj: ${{ matrix.devtools_csproj }}
      typecheck: ${{ matrix.typecheck }}
      test: ${{ matrix.test }}
      bundle: ${{ matrix.bundle }}
      prepare_args: ${{ needs.plan.outputs.args }}

  settle:
    needs: [plan, prepare]
    # Runs when some legs failed: the ones that passed go on, each judged alone.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
      matrix: ${{ steps.tags.outputs.matrix }}
      count: ${{ steps.tags.outputs.count }}
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: "24" }

      - uses: actions/download-artifact@v4
        with:
          pattern: uplink-*
          path: ${{ runner.temp }}/legs
          merge-multiple: true

      # A leg writes its prepare file as the last thing it does, so a file is the
      # record that the leg passed, and a failed leg leaves none.
      - id: tags
        env:
          PLANNED: ${{ needs.plan.outputs.ids }}
        run: |
          set -euo pipefail
          legs="$RUNNER_TEMP/legs"
          mkdir -p "$legs"
          node -e '
            const fs = require("fs");
            const dir = process.argv[1];
            const released = fs.readdirSync(dir).filter((f) => /^prepare-.*\.json$/.test(f))
              .map((f) => JSON.parse(fs.readFileSync(dir + "/" + f, "utf8")))
              .sort((a, b) => a.id.localeCompare(b.id));
            const out = [];
            out.push("tags=" + JSON.stringify(released.map((r) => r.id + "-v" + r.version)));
            out.push("matrix=" + JSON.stringify({ include: released.map((r) => ({ id: r.id })) }));
            out.push("count=" + released.length);
            const planned = process.env.PLANNED.split(",").filter(Boolean);
            const prepared = new Set(released.map((r) => r.id));
            const failed = planned.filter((id) => !prepared.has(id));
            console.log(out.join("\n"));
            fs.writeFileSync(dir + "/summary.md", "### Prepared\n\n" + (released.map((r) => "- " + r.id + "-v" + r.version).join("\n") || "nothing") + (failed.length ? "\n\n### Failed to prepare, not released\n\n" + failed.map((id) => "- " + id).join("\n") : "") + "\n");
          ' "$legs" >> "$GITHUB_OUTPUT"
          cat "$legs/summary.md" >> "$GITHUB_STEP_SUMMARY"

  # The repo-wide checks and the scaffold proof: a failure here is about the
  # repository, so it stops every release.
  ci-shared:
    needs: [plan, settle]
    if: ${{ !cancelled() && inputs.dry_run == false && needs.settle.result == 'success' && needs.settle.outputs.count != '0' }}
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      scope: shared

  # One run of the legs per Uplink, so one Uplink's failing check stops that
  # Uplink's release and no other.
  ci:
    needs: [plan, settle]
    if: ${{ !cancelled() && inputs.dry_run == false && needs.settle.result == 'success' && needs.settle.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.settle.outputs.matrix) }}
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      uplinks: ${{ matrix.id }}
      scope: legs

  release:
    needs: [plan, settle, ci-shared, ci]
    if: ${{ !cancelled() && inputs.dry_run == false && needs.settle.result == 'success' && needs.ci-shared.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: ci-passed-*
          path: ${{ runner.temp }}/passed
          merge-multiple: true

      # An Uplink is tagged only when its own prepare leg and its own legs both
      # passed. The others are named in the run's summary and make it red once
      # the passing ones are out.
      - id: pick
        env:
          TAGS: ${{ needs.settle.outputs.tags }}
          PLANNED: ${{ needs.plan.outputs.ids }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/passed"
          node -e '
            const fs = require("fs");
            const dir = process.argv[1];
            const passed = new Set(fs.readdirSync(dir).filter((f) => f.endsWith(".txt"))
              .map((f) => fs.readFileSync(dir + "/" + f, "utf8").trim()));
            const tags = JSON.parse(process.env.TAGS);
            const ready = tags.filter((t) => passed.has(t.replace(/-v\d.*$/, "")));
            const readyIds = new Set(ready.map((t) => t.replace(/-v\d.*$/, "")));
            const held = process.env.PLANNED.split(",").filter(Boolean).filter((id) => !readyIds.has(id));
            console.log("tags=" + JSON.stringify(ready));
            console.log("held=" + held.join(","));
          ' "$RUNNER_TEMP/passed" >> "$GITHUB_OUTPUT"

      # main moves to the commit that was checked and the tags go with it, in one push
      # that either lands whole or not at all.
      - name: main moves to the checked commit
        if: steps.pick.outputs.tags != '[]'
        env:
          TAGS: ${{ steps.pick.outputs.tags }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor origin/main "$sha"; then
            echo "::error::main is no longer an ancestor of the checked commit, so it cannot fast-forward. Nothing was pushed."
            exit 1
          fi
          refs=()
          for tag in $(echo "$TAGS" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf8")).sort().join(" "))'); do
            git tag "$tag" "$sha"
            refs+=("refs/tags/$tag")
          done
          git push --atomic origin "$sha:refs/heads/main" "${refs[@]}"

      # A push made with this job's token starts no workflow, so each tag's
      # release is started on the tag's own ref. release.yml serialises the
      # publishing.
      - name: Start each release
        if: steps.pick.outputs.tags != '[]'
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ steps.pick.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $(echo "$TAGS" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf8")).sort().join(" "))'); do
            gh workflow run release.yml --ref "$tag"
            echo "started release.yml on $tag"
          done

      - name: Report the Uplinks that were not released
        env:
          HELD: ${{ steps.pick.outputs.held }}
        run: |
          if [ -n "$HELD" ]; then
            echo "### Not released: $HELD" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Not released: $HELD. Each failed its own checks above; the others went out."
            exit 1
          fi
