# Releases ONE Uplink when its tag (`<uplink id>-v<version>`) is pushed.
#
# The client bundle is committed to the `releases` branch at the path its
# baked `client.url` names, which is what jsDelivr serves: browsers refuse raw
# GitHub URLs on CORS, and jsDelivr mirrors git trees, never release assets. So
# no build output ever lands on main, and every release is rebuilt from source
# rather than copied out of a tracked file that can drift behind it.
#
# The mod zip goes on the tag's GitHub release, and only after the client is on
# the branch, so a DLL is never downloadable before the bundle it fetches.
name: release

on:
  push:
    tags: ["*-v*"]

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.tag.outputs.name }}
      id: ${{ steps.tag.outputs.id }}
      url: ${{ steps.tag.outputs.url }}
      leg: ${{ steps.tag.outputs.leg }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # A release is baked from the tree its tag names, so a tag on an unmerged
      # branch would ship code main never reviewed.
      - name: The tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - id: tag
        run: node tooling/resolve-release-tag.mjs "$GITHUB_REF_NAME" --github >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    uses: ./.github/workflows/_uplink-tasks.yml
    # See ci.yml: an omitted secret arrives in a reusable workflow as the empty
    # string, and the reference-set checkout then 404s.
    secrets: inherit
    with:
      name: ${{ fromJson(needs.resolve.outputs.leg).name }}
      id: ${{ fromJson(needs.resolve.outputs.leg).id }}
      client: ${{ fromJson(needs.resolve.outputs.leg).client }}
      mod_csproj: ${{ fromJson(needs.resolve.outputs.leg).mod_csproj }}
      tests_csproj: ${{ fromJson(needs.resolve.outputs.leg).tests_csproj }}
      codegen_csproj: ${{ fromJson(needs.resolve.outputs.leg).codegen_csproj }}
      typecheck: ${{ fromJson(needs.resolve.outputs.leg).typecheck }}
      test: ${{ fromJson(needs.resolve.outputs.leg).test }}
      bundle: ${{ fromJson(needs.resolve.outputs.leg).bundle }}
      publish: true

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two tags pushed together would each commit to `releases` from the same
    # parent, and the second push would be rejected after its build had passed.
    concurrency:
      group: releases-branch
      cancel-in-progress: false
    env:
      NAME: ${{ needs.resolve.outputs.name }}
      URL: ${{ needs.resolve.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }

      - uses: actions/download-artifact@v4
        with:
          name: uplink-${{ needs.resolve.outputs.id }}
          path: artifacts

      - name: Check out the releases branch
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin releases > /dev/null; then
            git fetch --no-tags origin releases:releases
            git worktree add .releases releases
          else
            git worktree add --orphan -b releases .releases
          fi

      # Refuses a checkout of any ref other than the one the URL names, and a
      # version already published with different bytes.
      - name: Publish the client into the releases branch
        run: node tooling/publish-release.mjs "$NAME" --to .releases --base https://cdn.jsdelivr.net

      # A push can report success without the remote moving, so the landing is
      # read back from the remote rather than taken from the exit code.
      - name: Commit and push the releases branch
        working-directory: .releases
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "$GITHUB_REF_NAME is already on releases, byte for byte."
            exit 0
          fi
          git commit -q -m "release: $GITHUB_REF_NAME"
          git push origin releases
          local=$(git rev-parse HEAD)
          remote=$(git ls-remote origin refs/heads/releases | cut -f1)
          if [ "$local" != "$remote" ]; then
            echo "::error::pushed $local but origin/releases is $remote"
            exit 1
          fi

      # jsDelivr caches a branch's head for twelve hours, so the new path can
      # 404 until then. A failed purge only delays the file, so it warns.
      - name: Purge the new URLs from jsDelivr
        run: |
          for u in "$URL" "${URL%/*}/gonogo-uplink.json"; do
            curl -fsS -o /dev/null "https://purge.jsdelivr.net/${u#https://cdn.jsdelivr.net/}" \
              || echo "::warning::purging $u failed; jsDelivr serves it once its branch cache lapses"
          done

      - name: Attach the mod to the tag's GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*.zip \
            --verify-tag --title "$GITHUB_REF_NAME" --notes "Client: $URL"
