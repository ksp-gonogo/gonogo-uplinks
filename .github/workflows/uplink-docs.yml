name: uplink pages

# Regenerate every Uplink's page on a push to main and commit the result back.
#
# The pages are DERIVED: from each Uplink's registrations, its generated contract
# slice, its fixtures, and the one `uplink.md` its author writes. Nothing about
# them is a decision, so nothing about them should need a human to remember. A
# widget gaining a channel, a contract field gaining a unit, a fixture being
# renamed: each changes the page, and each lands in a commit whose author was
# thinking about something else.
#
# ## Why this and the PR check both exist
#
# `ci.yml`'s per-leg "Docs are current" step fails a pull request whose page has
# moved, and it is not made redundant by this. A workflow that silently fixes
# main means nobody ever sees a generator that has quietly stopped emitting a
# section: the page would keep being "current" against a generator that no longer
# produces the wire table, and every run would agree. The PR check is where a
# person looks; this keeps main from carrying a page it could have fixed itself.
#
# ## Why this cannot loop
#
# It commits with GITHUB_TOKEN, and a push made with that token does NOT trigger
# workflow runs. So the commit this makes starts no further run, and there is no
# loop to guard against with an actor check or a `[skip ci]` marker.
#
# ## Renders are committed, and the pictures a GitHub page loads depend on it
#
# `renders/` is gitignored (review output, regenerated on demand) and
# `docs/assets/` is NOT, because the generated page references that path and a
# gitignored image is an image GitHub renders as a broken icon.

on:
  push:
    branches: [main]
  # By hand, for any ref: useful after a generator change lands on a branch, and
  # necessary because a GITHUB_TOKEN push gives no run of its own.
  workflow_dispatch:

# contents: write so the job can commit the regenerated pages back.
permissions:
  contents: write

# One run at a time on a ref, and the later one wins. Two concurrent runs would
# both regenerate and both push, and the loser's push is rejected as
# non-fast-forward after paying for every render.
concurrency:
  group: uplink-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with: { node-version: "24" }

      # Per client, because that is how this repo installs: each Uplink's client
      # is its own npm project against the vendored published tarballs, which is
      # the point (it is what a third-party author has).
      - name: Install client dependencies
        run: |
          set -euo pipefail
          node scripts/uplink-matrix.mjs |
            node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                for (const leg of JSON.parse(s)) if (leg.client) console.log(leg.name);
              });
            ' > /tmp/uplink-clients.txt
          if [ ! -s /tmp/uplink-clients.txt ]; then
            echo "✖ discovered no client-bearing Uplink, so this installed nothing."
            exit 1
          fi
          while IFS= read -r name; do
            ( cd "uplinks/$name/client" && npm ci --no-audit --no-fund )
          done < /tmp/uplink-clients.txt

      # Chromium alone: the page harness launches nothing else, and the renders
      # embedded in a page are whatever THIS engine produced. That is also why the
      # images are generated here rather than accepted from a contributor's
      # machine.
      #
      # Once per client, through that client's own playwright: each lockfile pins
      # its own version and each version launches its own chromium revision. One
      # `npx playwright install` from the repo root fetches the newest playwright
      # instead, and installs a revision the locked clients do not launch.
      - name: Install the browser the page harness renders in
        run: |
          set -euo pipefail
          while IFS= read -r name; do
            ( cd "uplinks/$name/client" && npm exec --no -- playwright install --with-deps chromium )
          done < /tmp/uplink-clients.txt

      # The same script the PR check runs with `--check`, so what heals main and
      # what fails a pull request cannot disagree about which Uplinks they cover.
      - name: Regenerate every Uplink page
        run: node tooling/uplink-docs.mjs

      # Asking whether the run actually left a page behind. Not the same question
      # as the step above, which fails when the CLI errors: this one fails when it
      # exited 0 having written nothing.
      - name: Every Uplink has a generated page
        run: node tooling/uplink-docs.mjs --gate

      # The front door lists the Uplinks and links each row at its own README, so
      # an Uplink that just gained one changes the table.
      - name: Regenerate the root README table
        run: node tooling/generate-root-readme.mjs

      - name: Commit and push the pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md 'uplinks/*/client/README.md' \
                  'uplinks/*/client/gonogo-uplink.json' \
                  'uplinks/*/client/docs/assets/*.png' \
                  'uplinks/*/client/docs/assets/render-shape.json'

          # Only a genuinely NON-DETERMINISTIC asset is staged by NAME rather
          # than by bytes, and that is one kind: a motion scene's GIF, which
          # three regenerations of an unchanged tree encode three different ways.
          # Staging its bytes would commit a churn asset on every push forever,
          # and a commit that always appears is a commit nobody reads. So one
          # ADDED (a new fixture) or DELETED (a fixture removed) is real drift
          # and is committed; one whose bytes merely moved is discarded.
          #
          # EVERYTHING ELSE IS STAGED BY BYTES, above. A PNG re-renders
          # byte-identically on the same runner, and `render-shape.json` is not
          # an asset at all: it is the record `docs --check` compares a render
          # against. Both used to sit in the discard below, which is why this
          # workflow could regenerate a changed page, throw the change away, and
          # report "nothing to commit" while every CI leg failed on that same
          # page. It ran 29 times without one success.
          #
          # The pathspec ends `/*.gif` and the wildcard is load-bearing: a git
          # pathspec containing one is matched as a PATTERN against whole paths
          # rather than resolved as a directory prefix.
          git status --porcelain -- 'uplinks/*/client/docs/assets/*.gif' |
            while read -r code path; do
              case "$code" in
                '??' | 'D') git add -A -- "$path" ;;
                *) git checkout -- "$path" ;;
              esac
            done

          # A heal that leaves the checker failing has not healed, so this runs
          # BEFORE the push rather than after it: a run that cannot satisfy the
          # check must not put its commit on main. It is the same `--check`
          # `_uplink-tasks.yml` runs per leg, against the tree staged above, and
          # if it fails the staging policy dropped something the check reads.
          # That is not hypothetical: it is the whole history of this workflow
          # before #350, which regenerated pages, discarded them, and reported
          # nothing to commit while every CI leg failed on those same pages.
          node tooling/uplink-docs.mjs --check

          if git diff --cached --quiet; then
            echo "Every Uplink page already describes the code. Nothing to commit."
          else
            git diff --cached --name-status
            git commit -m "chore: regenerate Uplink pages"
            git push origin HEAD:${{ github.ref_name }}
          fi
